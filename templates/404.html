{% extends "base.html" %}
{% block title %}404 :: {{ config.title }}{% endblock title %}
{% block content %}
{% set term_title = "404" %}
{% include "partials/terminal.html" %}
<noscript>
<article class="post">
<pre>404: No such file or directory</pre>
<p>That page doesn't exist. Try <a href="{{ get_url(path="/") }}">home</a>,
<a href="{{ get_url(path="services") }}">services</a>, <a href="{{ get_url(path="work") }}">work</a>,
<a href="{{ get_url(path="tools") }}">tools</a> or <a href="{{ get_url(path="contact") }}">contact</a>.</p>
</article>
</noscript>
<script>
// type the missing path into the terminal, let it fail, then show what does exist
(function () {
  var path = location.pathname.replace(/[^A-Za-z0-9\/._-]/g, "").replace(/\/+$/, "").slice(0, 60) || "/";
  window.__AUTORUN__ = "cd " + path + " && ls";
})();
</script>
<script src="{{ get_url(path="terminal.js", cachebust=true) }}" defer></script>
{% endblock content %}
