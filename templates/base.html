<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  (function () {
    try {
      var t = localStorage.getItem("site_theme");
      if (t && t !== "default") document.documentElement.setAttribute("data-term-theme", t);
    } catch (e) {}
  })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{{ config.description }}">
  <link rel="stylesheet" href="{{ get_url(path="style.css") }}">
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="{{ get_url(path="atom.xml") }}">
  <link rel="icon" type="image/svg+xml" href="{{ get_url(path="favicon.svg") }}">
  <meta property="og:title" content="{% if page is defined %}{{ page.title }}{% else %}{{ config.title }}{% endif %}">
  <meta property="og:description" content="{% if page is defined and page.description %}{{ page.description }}{% else %}{{ config.description }}{% endif %}">
  <meta property="og:type" content="{% if page is defined %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{% if page is defined %}{{ page.permalink }}{% else %}{{ config.base_url }}{% endif %}">
  <meta name="twitter:card" content="summary">
</head>
<body>
  <header class="site-header">
    <div class="prompt" data-cmd="cd /">cam@legitbiz.xyz:~#</div>
    <nav class="site-nav">
      <a href="{{ get_url(path="/") }}" data-cmd="cd /posts &amp;&amp; ls">posts/</a>
      <a href="{{ get_url(path="about") }}" data-cmd="whoami">whoami/</a>
      <a href="{{ get_url(path="music") }}" data-cmd="cd /music &amp;&amp; ls">music/</a>
      <a href="{{ get_url(path="thingsAndStuff") }}" data-cmd="cd /thingsAndStuff &amp;&amp; ls">thingsAndStuff/</a>
      <a href="{{ get_url(path="contact") }}" data-cmd="contact">contact/</a>
      <a href="{{ get_url(path="tools") }}" data-cmd="cd /tools">tools/</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock content %}
  </main>
  <footer class="site-footer">
    <span>this is neither financial NOR legal advice. these articles contain no commercial value.</span>
  </footer>
  <script>
  fetch("http://100.111.221.80:8833/hits", { method: "POST", mode: "no-cors" }).catch(function () {});
  </script>
</body>
</html>
