{% extends "base.html" %}
{% block title %}{{ page.title }} :: {{ config.title }}{% endblock title %}
{% block content %}
<article class="post">
  <h1>{{ page.title }}</h1>
  {% if page.date %}<span class="date">{{ page.date | date(format="%Y-%m-%d") }}</span>{% endif %}
  {{ page.content | safe }}
</article>
{% endblock content %}
