{% extends "base.html" %}
{% block content %}
{% set term_title = page.title %}
{% include "partials/terminal.html" %}
<noscript>
<article class="post">
  <h1>{{ page.title }}</h1>
  {{ page.content | safe }}
  {% if page.extra.oss %}{% include "partials/tools_list.html" %}{% endif %}
</article>
</noscript>
<script>
window.__AUTORUN__ = {{ page.extra.cmd | default(value=page.title) | json_encode() | safe }};
{% if page.extra.toolbox %}// /tools/#jwt opens that one tool
if (location.hash.length > 1) window.__AUTORUN__ = "toolbox " + location.hash.slice(1).replace(/[^a-z0-9.-]/gi, "");
{% endif %}</script>
{% if page.extra.toolbox %}{% include "partials/toolbox.html" %}
<script src="{{ get_url(path="toolbox.js", cachebust=true) }}" defer></script>{% endif %}
<script src="{{ get_url(path="terminal.js", cachebust=true) }}" defer></script>
{% endblock content %}
